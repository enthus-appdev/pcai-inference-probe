replicaCount: 1

image:
  repository: ghcr.io/enthus-appdev/pcai-inference-probe
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Pre-create this Secret in the framework release namespace. No inline key value.
auth:
  existingSecret: pcai-inference-probe-api
  secretKey: api-key

resources:
  requests:
    cpu: 100m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi
    ephemeral-storage: 512Mi

shm:
  sizeLimit: 2Gi

# A dedicated small PVC for persistence qualification; not sized for model weights.
persistence:
  enabled: true
  existingClaim: ""
  size: 1Gi
  storageClass: null
  accessMode: ReadWriteOnce
  retainOnDelete: true

# Optional TUN-less WireGuard reverse TCP sidecar. Never creates its credential Secret.
wireguard:
  enabled: false
  image:
    repository: ghcr.io/windtf/wireproxy
    tag: 31a9a34498267d7fb8aeff05aba79d929b15eb39
    digest: sha256:24db66eec033a080d62ff2e39f8df36c215696053114d97e683873cbc18b7537
    pullPolicy: IfNotPresent
  existingSecret: ""
  secretKey: wireproxy.conf
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

maxBodyBytes: 8388608
readyDelaySeconds: 0
nodeSelector: {}
tolerations: []

ezua:
  virtualService:
    enabled: true
    # Put this explicitly in PCAI override values so its controller substitutes it.
    endpoint: "pcai-probe.${DOMAIN_NAME}"
    istioGateway: istio-system/ezaf-gateway
    timeout: 900s
  # Off by default: do not add a cross-namespace policy without platform approval.
  # Disabling this does NOT disable any existing gateway/platform authorization.
  authorizationPolicy:
    enabled: false
    namespace: istio-system
    providerName: oauth2-proxy
    matchLabels:
      istio: ingressgateway
