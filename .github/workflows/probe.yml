name: Probe checks and image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.1
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and offline Helm contracts
        run: |
          python -m unittest discover -s probe/tests -v
          python -m unittest discover -s checks -p 'test_*.py' -v
          node --check probe/app.js
          helm lint charts/pcai-inference-probe
          git diff --check
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU-only smoke image
        uses: docker/build-push-action@v7
        with:
          context: ./probe
          file: ./probe/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: pcai-inference-probe:local
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Non-root container smoke (no GPU)
        run: python checks/container_smoke.py
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish standalone probe image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./probe
          file: ./probe/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/enthus-appdev/pcai-inference-probe:latest
            ghcr.io/enthus-appdev/pcai-inference-probe:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Package immutable-image PCAI chart
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          root = Path('charts/pcai-inference-probe')
          chart = yaml.safe_load((root / 'Chart.yaml').read_text())
          chart['version'] = '0.1.0-ci.' + os.environ['GITHUB_RUN_NUMBER']
          (root / 'Chart.yaml').write_text(yaml.safe_dump(chart, sort_keys=False))
          values = yaml.safe_load((root / 'values.yaml').read_text())
          values['image']['tag'] = 'sha-' + os.environ['GITHUB_SHA']
          values['image']['digest'] = os.environ['IMAGE_DIGEST']
          (root / 'values.yaml').write_text(yaml.safe_dump(values, sort_keys=False))
          PY
          mkdir -p dist
          helm lint charts/pcai-inference-probe
          helm package charts/pcai-inference-probe --destination dist
          cp dist/*.tgz dist/pcai-inference-probe.tar.gz
          sha256sum dist/*.tgz dist/*.tar.gz > dist/SHA256SUMS
          printf '%s\n' 'ghcr.io/enthus-appdev/pcai-inference-probe@${{ steps.publish.outputs.digest }}' > dist/IMAGE.txt
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: pcai-inference-probe-framework
          path: dist/
          if-no-files-found: error

  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify license
        run: test -s LICENSE && grep -q 'Apache License' LICENSE
